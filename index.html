<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深時培養皿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=Spectral:ital@1&display=swap">
<style>
/* Layout: instrument console — controls (left), observation window (center), specimen record (right) */
:root {
  --abyss: #0a1020; --hull: #111a2e; --hull-2: #18233d; --rule: #26344f;
  --ink: #ece6d6; --muted: #98a1b6; --brass: #d6ab55; --brass-ink: #1b1406;
  --lumen: #6fe0cf; --ember: #ff8a6b;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-latin: "Spectral", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { background: var(--abyss); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.55; padding: 0 16px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-block: 18px 14px; border-bottom: 1px solid var(--rule); }
.brand h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 3.4vw, 36px); letter-spacing: .04em; margin: 0; line-height: 1.1; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.stat { display: grid; gap: 0; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
.stat b { font-family: var(--f-mono); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat.t b { color: var(--brass); }

.console { display: grid; grid-template-columns: 290px minmax(0, 1fr) 340px; gap: 16px; padding-block: 16px 28px; align-items: start; }
@media (max-width: 1260px) { .console { grid-template-columns: 280px minmax(0, 1fr); } .record { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; } }
@media (max-width: 820px) { .console { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }

.panel { background: var(--hull); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; min-width: 0; }
.panel + .panel { margin-top: 16px; }
.record .panel + .panel { margin-top: 0; }
@media (min-width: 1261px) { .record .panel + .panel { margin-top: 16px; } }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.ph h2 { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 0; letter-spacing: .06em; }
.ph small { color: var(--muted); font-size: 11px; letter-spacing: .1em; }

.scenes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.scene { background: var(--hull-2); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 6px; text-align: center; display: grid; gap: 2px; }
.scene b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.scene span { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.scene[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in oklab, var(--brass) 14%, var(--hull-2)); }
.scene[aria-pressed="true"] b { color: var(--brass); }

.param { display: grid; gap: 4px; padding-block: 9px; border-top: 1px solid var(--rule); }
.param:first-of-type { border-top: 0; }
.param-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.param label { font-weight: 500; }
.param output { font-family: var(--f-mono); font-size: 12.5px; color: var(--brass); font-variant-numeric: tabular-nums; text-align: right; }
.param output i { font-style: normal; color: var(--ember); margin-left: 6px; }
.param .hint { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brass) var(--p), var(--rule) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brass) var(--p), var(--rule) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--ink); border: 3px solid var(--brass); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 3px solid var(--brass); }
input[type=range]:disabled { opacity: .4; }

.events { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ev { background: var(--hull-2); border: 1px solid var(--rule); border-radius: 4px; padding: 8px; text-align: left; display: grid; gap: 1px; }
.ev b { font-size: 13.5px; font-weight: 700; }
.ev span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.ev:hover { border-color: var(--ember); }

.stage { min-width: 0; display: grid; gap: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--hull); }
.seg button { background: none; border: 0; padding: 6px 11px; font-size: 13px; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.btn { background: var(--hull); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 11px; font-size: 13px; }
.btn.primary { background: var(--lumen); color: #06201c; border-color: var(--lumen); font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

.window { position: relative; aspect-ratio: 1000 / 620; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--rule); background: #050810; box-shadow: inset 0 0 0 4px #0c1426; }
.window canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.window.sow canvas { cursor: crosshair; }
.overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; padding: 16px 20px; background: rgba(6, 10, 20, .72); border: 1px solid var(--rule); border-radius: 6px; max-width: 80%; }
.overlay b { display: block; font-family: var(--f-display); font-size: 20px; color: var(--lumen); }
.overlay span { color: var(--muted); font-size: 13px; }
.caption { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
.caption b { color: var(--ink); font-weight: 500; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sp { background: var(--hull); border: 1px solid var(--rule); border-radius: 4px; padding: 6px; display: grid; gap: 2px; text-align: left; min-width: 0; }
.sp canvas { width: 100%; aspect-ratio: 3 / 2; display: block; background: #0b1324; border-radius: 3px; }
.sp b { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp em { font-family: var(--f-latin); font-style: italic; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .pop { font-family: var(--f-mono); font-size: 11px; color: var(--lumen); }
.sp[aria-pressed="true"] { border-color: var(--brass); }

.card-art { position: relative; background: radial-gradient(ellipse at 50% 55%, #1b2a4a, #0b1324 70%); border-radius: 4px; border: 1px solid var(--rule); }
.card-art canvas { width: 100%; aspect-ratio: 16 / 10; display: block; }
.badge { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--ember); color: #2a0d05; font-weight: 700; }
.badge.live { background: var(--lumen); color: #06201c; }
.sname { margin: 10px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.lname { font-family: var(--f-latin); font-style: italic; color: var(--muted); font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.meta b { color: var(--ink); font-weight: 500; font-family: var(--f-mono); font-size: 12px; }
.traits { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; }
.traits .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.traits .bar i { display: block; height: 100%; background: var(--brass); }
.traits .v { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; min-width: 4.5em; }
.why { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 13px; }
.why li { padding-left: 14px; position: relative; max-width: 62ch; }
.why li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--lumen); }

.tree-wrap { position: relative; }
.tree-wrap canvas { width: 100%; height: 200px; display: block; cursor: pointer; }
.tree-axis { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 280px; overflow-y: auto; font-size: 12.5px; }
.log li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.log time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.log .birth span { color: var(--ink); }
.log .death span { color: var(--ember); }
.log .mile span { color: var(--brass); font-weight: 700; }
.log .event span { color: var(--lumen); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head><body>
<header class="top">
  <div class="brand">
    <h1>深時培養皿</h1>
    <p>調整環境、撒下細胞，看天擇在億萬年間雕出什麼樣的生物。</p>
  </div>
  <div class="stats" aria-live="off">
    <div class="stat t"><span>地質時間</span><b id="sTime">0</b></div>
    <div class="stat"><span>個體數</span><b id="sPop">0</b></div>
    <div class="stat"><span>現存物種</span><b id="sLive">0</b></div>
    <div class="stat"><span>已滅絕</span><b id="sDead">0</b></div>
  </div>
</header>

<main class="console">
  <aside class="controls">
    <section class="panel">
      <div class="ph"><h2>場景</h2><small>切換會重新開始</small></div>
      <div class="scenes" id="scenes"></div>
    </section>
    <section class="panel">
      <div class="ph"><h2>環境參數</h2><small>隨時可調</small></div>
      <div id="params"></div>
    </section>
    <section class="panel">
      <div class="ph"><h2>演化節奏</h2><small>切換場景會保留</small></div>
      <div class="param">
        <div class="param-row"><label for="vertRate">脊椎動物突變率</label><output id="vertRateOut"></output></div>
        <input type="range" id="vertRate" min="0" max="50" step="1" value="10">
        <div class="hint">調高後更容易長出脊索、下顎和四肢；調到 0 就只會有無脊椎動物</div>
      </div>
    </section>
    <section class="panel">
      <div class="ph"><h2>地質事件</h2><small>效果會逐漸消退</small></div>
      <div class="events" id="events"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="toolbar">
      <div class="tools">
        <div class="seg" role="group" aria-label="游標工具">
          <button id="toolLook" aria-pressed="true">觀察</button>
          <button id="toolSow" aria-pressed="false">撒細胞</button>
        </div>
        <button class="btn primary" id="sowRandom">撒下一把細胞</button>
        <button class="btn" id="resetBtn">清空重來</button>
      </div>
      <div class="seg" role="group" aria-label="演化速度" id="speeds">
        <button data-s="0" aria-pressed="false">暫停</button>
        <button data-s="1" aria-pressed="false">1×</button>
        <button data-s="4" aria-pressed="true">4×</button>
        <button data-s="16" aria-pressed="false">16×</button>
      </div>
    </div>
    <div class="window" id="win">
      <canvas id="world"></canvas>
      <div class="overlay" id="hint" hidden><b>點擊畫面撒下細胞</b><span>或按「撒下一把細胞」隨機散布</span></div>
    </div>
    <div class="caption" id="caption"></div>
    <div class="gallery" id="gallery"></div>
  </section>

  <aside class="record">
    <section class="panel">
      <div class="ph"><h2>標本卡</h2><small>點畫面中的生物查看</small></div>
      <div class="card-art"><canvas id="portrait"></canvas><span class="badge live" id="badge">現存</span></div>
      <h3 class="sname" id="sName">—</h3>
      <div class="lname" id="sLatin"></div>
      <div class="meta" id="sMeta"></div>
      <div class="traits" id="sTraits"></div>
      <ul class="why" id="sWhy"></ul>
    </section>
    <section class="panel">
      <div class="ph"><h2>生命之樹</h2><small>點分支看物種</small></div>
      <div class="tree-wrap"><canvas id="tree"></canvas></div>
      <div class="tree-axis"><span>起源</span><span id="treeNow">現在</span></div>
    </section>
    <section class="panel">
      <div class="ph"><h2>演化紀事</h2><small>最新在上</small></div>
      <ul class="log" id="log"></ul>
    </section>
  </aside>
</main>
<script src="js/sim.js"></script>
<script src="js/draw.js"></script>
<script src="js/ui.js"></script>
</body></html>
